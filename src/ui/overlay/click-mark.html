<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    overflow: hidden;
    width: 60px; height: 60px;
  }
  .mark {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  /* Outer spinning ring */
  .ring {
    width: 44px; height: 44px;
    border: 3px solid transparent;
    border-top-color: #ef4444;
    border-right-color: #ef4444;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  /* Middle pulse ring */
  .pulse {
    position: absolute;
    top: 4px; left: 4px;
    width: 36px; height: 36px;
    border: 1.5px solid rgba(239,68,68,0.4);
    border-radius: 50%;
    animation: pulse 0.6s ease-out infinite;
  }
  /* Center dot */
  .dot {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 8px; height: 8px;
    background: #ef4444;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(239,68,68,0.8);
  }
  @keyframes spin {
    to { transform: translate(-50%, -50%) rotate(360deg); }
  }
  @keyframes pulse {
    0%   { transform: translate(0) scale(1);   opacity: 0.6; }
    100% { transform: translate(0) scale(1.3); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="mark">
    <div class="ring"></div>
    <div class="pulse"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
