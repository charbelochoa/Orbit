<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 380px; height: 72px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", sans-serif;
    pointer-events: none;
  }
  .widget {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 16px;
    height: 72px;
    background: rgba(9,9,11,0.88);
    border: 1px solid rgba(99,102,241,0.35);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    box-shadow:
      0 4px 24px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }
  /* Orbit logo — small colored circle */
  .logo {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: #fff; font-weight: 700;
  }
  .info {
    flex: 1;
    min-width: 0;
  }
  .label {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1;
    margin-bottom: 3px;
  }
  .status {
    font-size: 13px;
    color: rgba(255,255,255,0.9);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1;
  }
  /* Animated spinner dots */
  .spinner {
    flex-shrink: 0;
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .spinner span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #6366f1;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .spinner span:nth-child(1) { animation-delay: 0s; }
  .spinner span:nth-child(2) { animation-delay: 0.2s; }
  .spinner span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40%           { transform: scale(1);   opacity: 1; }
  }
  /* Loop counter badge */
  .badge {
    flex-shrink: 0;
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.06);
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    min-width: 32px;
    text-align: center;
    line-height: 16px;
  }
</style>
</head>
<body>
  <div class="widget" id="widget">
    <div class="logo">O</div>
    <div class="info">
      <div class="label">Orbit · Agente Activo</div>
      <div class="status" id="status">Iniciando tarea...</div>
    </div>
    <div class="badge" id="badge">0/25</div>
    <div class="spinner">
      <span></span><span></span><span></span>
    </div>
  </div>
  <script>
    // IPC from main process via contextBridge is not available here
    // (no preload for this tiny window). Use window title trick instead:
    // main.cjs calls win.setTitle("status|loops|max") to update content.
    const titleObserver = new MutationObserver(() => {
      const parts = document.title.split("|");
      if (parts[0]) document.getElementById("status").textContent = parts[0];
      if (parts[1] && parts[2]) document.getElementById("badge").textContent = `${parts[1]}/${parts[2]}`;
    });
    titleObserver.observe(document.querySelector("title") || document.head, { childList: true, subtree: true, characterData: true });
    // Also expose a global for direct webContents.executeJavaScript calls
    window.updateWidget = (statusText, loop, maxLoop) => {
      document.getElementById("status").textContent = statusText || "";
      if (loop != null) document.getElementById("badge").textContent = `${loop}/${maxLoop || 25}`;
    };
  </script>
</body>
</html>
